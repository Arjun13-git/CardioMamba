[project]
name = "cardiomamba"
version = "0.1.0"
description = "Mamba / selective state-space model for multi-label 12-lead ECG classification on PTB-XL (educational/research use only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch~=2.13.0",
    "numpy~=2.3",
    "scipy~=1.16",
    "pandas~=2.3",
    "wfdb~=4.3",
    "scikit-learn~=1.7",
    "pyyaml~=6.0",
    "matplotlib~=3.10",
    "tqdm~=4.67",
]

[dependency-groups]
dev = [
    "pytest~=8.4",
    "ruff~=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cardiomamba"
module-root = "ml/src"

# CUDA 13.0 PyTorch wheels (bundle their own CUDA runtime; the local driver supports CUDA 13.x).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests", "ml/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["cardiomamba", "conftest"]
